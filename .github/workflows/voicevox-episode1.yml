name: VOICEVOX Episode 1

on:
  pull_request:
    branches: [master]
    paths:
      - 'voicevox_episode1/**'
      - '.github/workflows/voicevox-episode1.yml'

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Start official VOICEVOX Engine
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest

      - name: Generate and master episode audio
        run: python3 voicevox_episode1/synthesize.py

      - name: Upload finished audio
        uses: actions/upload-artifact@v4
        with:
          name: white-room-episode1-voicevox
          path: |
            voicevox_episode1/output/白い部屋の証人_第1話_VOICEVOX.mp3
            voicevox_episode1/output/白い部屋の証人_第1話_VOICEVOX.m4a
            voicevox_episode1/output/白い部屋の証人_第1話_VOICEVOX.wav
            voicevox_episode1/output/話者・台詞一覧.json
          compression-level: 0
          retention-days: 1

      - name: Engine logs on failure
        if: failure()
        run: docker logs voicevox || true
